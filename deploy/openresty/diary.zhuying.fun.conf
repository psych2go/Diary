server {
    listen 80;
    server_name diary.zhuying.fun;
    server_tokens off;

    access_log off;
    error_log /www/sites/diary.zhuying.fun/log/error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name diary.zhuying.fun;
    server_tokens off;

    ssl_certificate /www/sites/diary.zhuying.fun/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/diary.zhuying.fun/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MYDIARY_SSL:10m;
    ssl_session_timeout 10m;

    access_log off;
    error_log /www/sites/diary.zhuying.fun/log/error.log warn;

    client_max_body_size 512k;
    client_body_timeout 15s;
    keepalive_timeout 15s;

    location / {
        limit_except GET POST HEAD {
            deny all;
        }

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
    }
}
